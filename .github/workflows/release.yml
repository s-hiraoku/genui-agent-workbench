name: Build Release Asset

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --include=optional
      - name: Build macOS arm64 zip
        run: npm run electron:zip -- --arm64
      - name: Prepare stable asset name
        run: |
          mkdir -p release
          asset="$(find dist -maxdepth 1 -name 'GenUI Popup Broker-*-arm64-mac.zip' -print -quit)"
          test -n "$asset"
          cp "$asset" "release/genui-popup-broker-macos-arm64.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: release/genui-popup-broker-macos-arm64.zip
          generate_release_notes: true
